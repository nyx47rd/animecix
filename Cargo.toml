[package]
name = "animecix"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.8", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.6", features = ["v1_4"] }
glib = "0.19"
gdk-pixbuf = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[profile.release]
lto = true
